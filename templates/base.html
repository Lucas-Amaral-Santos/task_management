<!DOCTYPE html>
<html>
    <head>
        <title>Suporte Informática</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
        <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
        <script src="https://kit.fontawesome.com/5dafd9f8c0.js" crossorigin="anonymous"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png">        

    </head>
    <body>
        <header>
        <div class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="#">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" width="60" height="50" class="d-inline-block align-top">
            </a>
            <div class="collapse navbar-collapse justify-content-around" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="{{ url_for('home') }}"><i class="fa-solid fa-house"></i> Início</a>
                    </li>
                    {% if session.is_admin %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('config') }}"><i class="fa-solid fa-table"></i> Tabelas Auxiliares</a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        {% if session.is_admin or not session.has_users %}
                            <a class="nav-link" href="{{ url_for('register') }}"><i class="fa-solid fa-user-plus"></i> Registrar</a>
                        {% endif %}
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}"><i class="fa-solid fa-sign-out-alt"></i> Sair</a>
                    </li>
                </ul>
            </div>  
        </div>
        </header>



        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </body>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</html>
